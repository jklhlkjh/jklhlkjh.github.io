<!DOCTYPE html>
<html>
<head>
<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
}

.scroller {
    white-space: nowrap;
    font-size: 80px;
    color: white;
    position: absolute;
    animation: scroll 10s linear infinite;
}

@keyframes scroll {
    from { transform: translateX(100%); }
    to { transform: translateX(-100%); }
}
</style>
</head>

<body>

<div class="scroller">
    You are not scared about getting banned in tf2, you are scared about losing items -nightweretf2
</div>

</body>
</html>
